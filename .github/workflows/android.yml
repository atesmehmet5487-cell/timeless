# Android APK'yı bulutta derler.
#
# Yerel makineye Android Studio ya da SDK kurmak gerekmez: GitHub'ın
# ubuntu çalıştırıcısında JDK ve Android SDK hazır gelir. Derleme bitince
# APK, çalıştırmanın "Artifacts" bölümünden indirilir.
name: Android APK

on:
  push:
    branches: [main]
  # Elle de başlatılabilsin
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Paketleri yükle
        run: npm ci

      - name: Testler
        run: npm test

      - name: Web tarafını derle
        run: npm run build
        # Bulut ayarları depoda durmaz; GitHub'da "Secrets and variables →
        # Actions" altında tutulur. (Firebase web anahtarı aslında gizli bir
        # sır değildir, uygulamanın içine gömülür; veriyi koruyan şey
        # firebase/firestore.rules içindeki e-posta izin listesidir. Yine de
        # depoda tutmuyoruz ki GitHub'ın tarayıcısı uyarı yağdırmasın.)
        # Secret girilmezse APK yalnızca cihaz verisiyle çalışır.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      # Secret unutulursa derleme sessizce bulutsuz bir APK üretir; bunu
      # fark etmek zor olduğu için burada açıkça duruyoruz.
      - name: Bulut ayarı geldi mi?
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "Secret tanımlı değil: APK yalnızca cihaz verisiyle çalışacak."
          elif grep -rq "$PROJECT_ID" dist/assets/*.js; then
            echo "Bulut ayarı pakete girdi."
          else
            echo "Bulut ayarı pakete girmedi — GitHub Secrets bölümünde VITE_FIREBASE_* kayıtlarını kontrol et." >&2
            exit 1
          fi
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Capacitor'ı eşitle
        run: npx cap sync android

      - name: APK derle (debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: timeless-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
