# Android APK'yı bulutta derler.
#
# Yerel makineye Android Studio ya da SDK kurmak gerekmez: GitHub'ın
# ubuntu çalıştırıcısında JDK ve Android SDK hazır gelir. Derleme bitince
# APK, çalıştırmanın "Artifacts" bölümünden indirilir.
name: Android APK

on:
  push:
    branches: [main]
  # Elle de başlatılabilsin
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Paketleri yükle
        run: npm ci

      - name: Testler
        run: npm test

      - name: Web tarafını derle
        run: npm run build
        # Firebase web ayarları gizli anahtar değildir: uygulamanın içine
        # gömülür, APK'yı açan herkes görebilir. Veriyi koruyan şey
        # firebase/firestore.rules içindeki e-posta izin listesidir.
        # Başka bir Firebase projesine geçilirse GitHub'da "Secrets and
        # variables → Actions" altına aynı isimlerle secret eklemek yeter;
        # secret varsa aşağıdaki değerlerin yerine o kullanılır.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyBB7HYtBBY2a49FZqBQnSCCFgAs9PfmCWg' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'timeless-9765d.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'timeless-9765d' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:531694982323:web:95dc738f1eee2f9336ccc6' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'timeless-9765d.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '531694982323' }}

      - name: Capacitor'ı eşitle
        run: npx cap sync android

      - name: APK derle (debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: timeless-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
